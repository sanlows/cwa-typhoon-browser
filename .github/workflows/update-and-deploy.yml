name: Update CWA data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cwa-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify parser and safety checks
        run: node --test
      - name: Fetch and accumulate CWA data
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ -z "$CWA_API_KEY" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo '::warning::CWA_API_KEY is missing; publishing the clearly labelled sample.'
          else
            node scripts/update-data.mjs
          fi
      - name: Preserve successful data for later runs
        run: |
          if ! git diff --quiet -- site/data/archive.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/archive.json
            git commit -m 'Update CWA cyclone archive'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
