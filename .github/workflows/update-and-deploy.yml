name: Update CWA data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cwa-refresh]

permissions:
  contents: read
concurrency:
  group: cwa-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify parser and safety checks
        run: node --test
      - name: Fetch and accumulate CWA data
        id: cyclone
        continue-on-error: true
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Update county weather and news independently
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          CYCLONE_FETCH_STATUS: ${{ steps.cyclone.outcome }}
        run: node scripts/update-portal.mjs
      - name: Preserve successful data for later runs
        run: |
          if ! git diff --quiet -- site/data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data
            git commit -m 'Update county weather, news and cyclone data'
            git push
          fi
      - name: Report partial cyclone update
        if: steps.cyclone.outcome == 'failure'
        run: echo '::warning::Cyclone fetch failed. Previous history is preserved; other sources are published independently. Check the public source timestamps.'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
